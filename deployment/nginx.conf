# Static hosting for the Quincy-UI bundle. The app sets no headers itself —
# every security header below is enforced here (.claude/rules/security.md).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed assets are immutable; the entry HTML must never be cached.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # SPA history fallback for React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # --- Security headers ---
  # Adjust connect-src to the real API and Sentry ingest origins per environment.
  # 'unsafe-inline' is allowed for style-src only because Tailwind's runtime and
  # Recharts inject inline styles; script-src deliberately has no such escape.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.quincy.example.com https://*.ingest.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  # Do not advertise the server version.
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
